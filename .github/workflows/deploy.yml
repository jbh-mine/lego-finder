name: Test and deploy LEGO Finder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lego-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Market API tests (SQLite and official response contract)
        working-directory: server/market-api
        run: npm test
      - run: npm ci --legacy-peer-deps
      - name: Regression tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Build
        run: npm run build
        env:
          CI: false
          REACT_APP_MARKET_API_URL: ${{ vars.MARKET_API_URL }}
      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
